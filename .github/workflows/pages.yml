name: Publikace dashboardu na GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/timeseries.csv"
      - "data/daily-history.csv"
      - "docs/data-archive.md"
      - "docs/source-audit.md"
      - "docs/original-data-comparison.md"
      - "docs/historical-data-corrections.csv"
      - "docs/expanded-data-*.md"
      - "docs/expanded-data-changes.csv"
      - "docs/daily-source-coverage.csv"
      - "docs/re-audit-*.md"
      - "docs/rb-data-changes-*.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Aktualizace PSD2 trackeru"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Stažení aktuálního repozitáře
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sestavení veřejného dashboardu
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/core.js dashboard/bank.html dashboard/bank.js dashboard/report.html dashboard/report.js dashboard/archive.html dashboard/archive.js dashboard/data.js dashboard/styles.css _site/
          cp dashboard/daily-data.js _site/daily-data.js
          cp data/timeseries.csv _site/timeseries.csv
          cp data/daily-history.csv _site/daily-history.csv
          cp docs/data-archive.md _site/data-archive.md
          cp docs/source-audit.md _site/source-audit.md
          cp docs/original-data-comparison.md _site/original-data-comparison.md
          cp docs/historical-data-corrections.csv _site/historical-data-corrections.csv
          cp docs/expanded-data-changes.csv docs/daily-source-coverage.csv docs/expanded-data-audit.md _site/
          cp docs/re-audit-2026-09-16.md docs/rb-data-changes-2026-09-16.csv _site/
          sed -i.bak \
            -e 's#../docs/source-audit.md#source-audit.md#' \
            -e 's#../docs/original-data-comparison.md#original-data-comparison.md#' \
            -e 's#../docs/historical-data-corrections.csv#historical-data-corrections.csv#' \
            -e 's#../docs/expanded-data-changes.csv#expanded-data-changes.csv#' \
            -e 's#../docs/rb-data-changes-2026-09-16.csv#rb-data-changes-2026-09-16.csv#' \
            -e 's#../data/timeseries.csv#timeseries.csv#' \
            _site/index.html
          rm _site/index.html.bak
          sed -i.bak \
            -e 's#../data/daily-history.csv#daily-history.csv#' \
            -e 's#../docs/data-archive.md#data-archive.md#' \
            _site/archive.html
          rm _site/archive.html.bak

      - name: Kontrola metrik a režimů srovnání
        run: node --test tests/test_dashboard.cjs

      - name: Nastavení GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nahrání dashboardu
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Zveřejnění dashboardu
        id: deployment
        uses: actions/deploy-pages@v4
