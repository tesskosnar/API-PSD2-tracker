name: Aktualizace PSD2 trackeru

on:
  schedule:
    # Utery 05:17 UTC. Nepravidelny cas omezuje spicky GitHub Actions.
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psd2-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stazeni repozitare
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace trackeru
        run: python -m pip install .

      - name: Kontrola bank
        run: psd2-tracker

      - name: Ulozeni zmen
        run: |
          if git diff --quiet -- README.md data/; then
            echo "Zdroje se nezmenily."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          git commit -m "data: aktualizace PSD2 statistik"
          git push
