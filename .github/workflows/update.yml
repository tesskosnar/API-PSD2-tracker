name: Aktualizace PSD2 trackeru

on:
  schedule:
    # Utery 05:17 UTC. Nepravidelny cas omezuje spicky GitHub Actions.
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psd2-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stazeni repozitare
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace trackeru
        run: python -m pip install .

      - name: Kontrola zpracování reportů
        run: python -m unittest discover -s tests -v

      - name: Kontrola bank
        run: psd2-tracker --config config/banks.json --data-dir data --readme README.md

      - name: Kontrola trvalého archivu
        run: python -m psd2_tracker.archive --data-dir data

      - name: Ulozeni zmen
        run: |
          if git diff --quiet -- README.md data/ dashboard/data.js dashboard/index.html dashboard/report.html dashboard/archive.html docs/trend.svg; then
            echo "Zdroje se nezmenily."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/ dashboard/data.js dashboard/index.html dashboard/report.html dashboard/archive.html docs/trend.svg
          git commit -m "data: aktualizace PSD2 statistik"
          git push
